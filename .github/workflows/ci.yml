name: CellProbe CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install editable package
        run: python -m pip install --no-deps -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test*.py" -v
      - name: CLI entrypoint check
        run: cellprobe --help
      - name: CLI script help check
        run: python scripts/cellprobe.py --help
      - name: CLI iOS fixture check
        run: python scripts/cellprobe.py analyze examples/sample_ios_quick.json --redact --format text
      - name: CLI Android fixture check
        run: python scripts/cellprobe.py analyze examples/sample_android_dump.txt --format text
